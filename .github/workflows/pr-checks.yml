name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  pr-checks:
    name: Lint, format, build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run CSS lint
        run: npm run lint:css

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm test
